name: Publish Xeni_brows to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site.zip
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published archive
        uses: actions/checkout@v4
      - name: Unpack built static website
        run: |
          mkdir -p _site
          unzip -q site.zip -d _site
          test -f _site/index.html || { echo "ERROR: index.html must be in root of the ZIP."; exit 1; }
          # Private/server files must never be served by GitHub Pages.
          rm -rf _site/api _site/.netlify _site/netlify
          find _site -type f \( -name '*.php' -o -name '.env*' -o -name '.htaccess' -o -name 'booking-secrets*' \) -delete
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
